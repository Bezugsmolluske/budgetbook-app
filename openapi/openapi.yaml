openapi: 3.0.3
info:
  title: BudgetBook API
  description: >
    REST backend for the BudgetBook personal finance application.

    Money movements are **transactions** with a `type` of `EXPENSE` or `INCOME`.
    Amounts are always positive integers in the **smallest currency unit**
    (cents for EUR). For example, `4250` means `42.50 €`.
    The `currency` field contains an ISO 4217 code (e.g. `"EUR"`).

    **Dates** follow ISO-8601 (`YYYY-MM-DD`).

    **Optimistic locking** — every PUT request must include the `version` field
    returned from the last GET/POST/PUT of the same resource. A mismatch returns
    `409 Conflict`.
  version: 3.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Transactions
    description: Income and expense records
  - name: Categories
    description: Categories scoped by transaction type
  - name: Summary
    description: Monthly aggregates (overview and statistics)
  - name: Backup
    description: Full data backup and restore (CSV / JSON)

paths:

  /transactions:
    get:
      tags: [Transactions]
      summary: List transactions
      description: >
        Returns transactions matching the optional filters, plus the signed net
        of the returned items (income minus expense). Omit a filter to ignore
        it. `from` and `to` are inclusive. If only one of `from`/`to` is set,
        the request is rejected.
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - $ref: '#/components/parameters/TypeParam'
        - $ref: '#/components/parameters/CategoryIdParam'
      responses:
        '200':
          description: Filtered list including the signed net sum
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsDto'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      tags: [Transactions]
      summary: Create a transaction
      description: >
        Creates a transaction. The body must not contain `id` or `version`.
        `categoryId` must refer to an existing category of the same `type`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionDtoCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: Relative URI of the new transaction (`/transactions/{id}`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /transactions/summary:
    get:
      tags: [Summary]
      summary: Monthly income, expense, and net totals
      description: >
        One bucket per calendar month in `[from, to]` (zeros included).
        Months after the current month are omitted. If `from`/`to` are omitted,
        the range is the earliest transaction date through today.
      parameters:
        - $ref: '#/components/parameters/FromParam'
        - $ref: '#/components/parameters/ToParam'
        - $ref: '#/components/parameters/TypeParam'
        - $ref: '#/components/parameters/CategoryIdParam'
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSummaryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'

    get:
      tags: [Transactions]
      summary: Get a transaction
      responses:
        '200':
          description: The transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDto'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Transactions]
      summary: Update a transaction
      description: >
        The `id` in the body must match the path and `version` is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionDtoUpdate'
      responses:
        '200':
          description: Updated transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Transactions]
      summary: Delete a transaction
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      tags: [Categories]
      summary: List categories
      parameters:
        - $ref: '#/components/parameters/TypeParam'
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryDto'

    post:
      tags: [Categories]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryDtoCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'

    get:
      tags: [Categories]
      summary: Get a category
      responses:
        '200':
          description: The category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDto'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Categories]
      summary: Update a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryDto'
      responses:
        '200':
          description: Updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags: [Categories]
      summary: Delete a category
      description: Fails with 409 if transactions still reference the category.
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /backup/csv:
    get:
      tags: [Backup]
      summary: Download full backup as CSV
      responses:
        '200':
          description: CSV backup file
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename=backup_2024-03-27.csv'
          content:
            application/csv:
              schema:
                type: string
                format: binary

    post:
      tags: [Backup]
      summary: Restore from CSV backup
      description: >
        Destructive replace of all data. If the database is not empty,
        pass `replace=true`.
      parameters:
        - $ref: '#/components/parameters/ReplaceParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '201':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRestoreDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /backup/json:
    get:
      tags: [Backup]
      summary: Download full backup as JSON
      responses:
        '200':
          description: JSON backup
          headers:
            Content-Disposition:
              schema:
                type: string
              example: 'attachment; filename=backup_2024-03-27.json'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupDto'

    post:
      tags: [Backup]
      summary: Restore from JSON backup
      description: >
        Destructive replace of all data. If the database is not empty,
        pass `replace=true`.
      parameters:
        - $ref: '#/components/parameters/ReplaceParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        '201':
          description: Restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupRestoreDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

components:

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Business UUID of the resource
      schema:
        type: string
        format: uuid

    FromParam:
      name: from
      in: query
      required: false
      description: Inclusive start date (ISO-8601). Requires `to`.
      schema:
        type: string
        format: date

    ToParam:
      name: to
      in: query
      required: false
      description: Inclusive end date (ISO-8601). Requires `from`.
      schema:
        type: string
        format: date

    TypeParam:
      name: type
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BookType'

    CategoryIdParam:
      name: categoryId
      in: query
      required: false
      schema:
        type: string
        format: uuid

    ReplaceParam:
      name: replace
      in: query
      required: false
      description: Required as `true` when restoring over a non-empty database.
      schema:
        type: boolean
        default: false

  schemas:

    BookType:
      type: string
      enum: [EXPENSE, INCOME]

    CategoryRefDto:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/BookType'

    TransactionDto:
      type: object
      required: [id, version, date, description, amount, currency, type, category]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: integer
          format: int64
          description: Amount in cents (always positive)
        currency:
          type: string
          example: EUR
        type:
          $ref: '#/components/schemas/BookType'
        category:
          $ref: '#/components/schemas/CategoryRefDto'
        createdAt:
          type: string
          format: date-time
        lastEditedAt:
          type: string
          format: date-time

    TransactionDtoCreate:
      type: object
      required: [date, description, amount, type, categoryId]
      properties:
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
          description: Defaults to EUR if omitted.
        type:
          $ref: '#/components/schemas/BookType'
        categoryId:
          type: string
          format: uuid

    TransactionDtoUpdate:
      type: object
      required: [id, version, date, description, amount, type, categoryId]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        date:
          type: string
          format: date
        description:
          type: string
        amount:
          type: integer
          format: int64
        currency:
          type: string
        type:
          $ref: '#/components/schemas/BookType'
        categoryId:
          type: string
          format: uuid

    TransactionsDto:
      type: object
      required: [sum, currency, items]
      properties:
        sum:
          type: integer
          format: int64
          description: >
            Signed net of the returned items in the smallest currency unit.
            Income adds; expense subtracts. Individual item amounts stay positive.
        currency:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionDto'

    CategoryDto:
      type: object
      required: [id, version, name, type]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        name:
          type: string
        type:
          $ref: '#/components/schemas/BookType'
        createdAt:
          type: string
          format: date-time
        lastEditedAt:
          type: string
          format: date-time

    CategoryDtoCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/BookType'

    TransactionSummaryDto:
      type: object
      required: [from, to, currency, expensesTotal, incomesTotal, net, mean, buckets]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        currency:
          type: string
        expensesTotal:
          type: integer
          format: int64
        incomesTotal:
          type: integer
          format: int64
        net:
          type: integer
          format: int64
          description: incomesTotal − expensesTotal
        mean:
          type: integer
          format: int64
          description: >
            Filtered-side total (or net if unfiltered) divided by bucket count.
            Zero when there are no buckets.
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/SummaryBucketDto'

    SummaryBucketDto:
      type: object
      required: [period, expenses, incomes, net]
      properties:
        period:
          type: string
          description: Year-month `YYYY-MM`
          example: '2024-03'
        expenses:
          type: integer
          format: int64
        incomes:
          type: integer
          format: int64
        net:
          type: integer
          format: int64

    BackupDto:
      type: object
      required: [schemaVersion, categories, transactions]
      properties:
        schemaVersion:
          type: integer
          example: 3
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDto'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionDto'

    BackupRestoreDto:
      type: object
      required: [filename]
      properties:
        filename:
          type: string

    ErrorDto:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [NOT_FOUND, VALIDATION, CONFLICT, INTERNAL]
        message:
          type: string

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    Conflict:
      description: Optimistic lock, unique name, or restore without replace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
    InternalServerError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
